name: Update activity graph

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-activity-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Fetch public contribution calendar
        run: |
          curl --fail-with-body -sS \
            -A "Mozilla/5.0" \
            "https://github.com/users/Raahin-SUhail/contributions" \
            -o /tmp/contrib.html

      - name: Generate SVG
        run: python scripts/generate_activity_graph.py

      - name: Commit updated graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity-graph.svg
          git diff --cached --quiet || git commit -m "Update contribution activity graph"
          git push
