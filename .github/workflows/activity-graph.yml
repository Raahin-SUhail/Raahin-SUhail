name: Update activity streak

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-streak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Fetch public contribution calendar
        run: |
          curl --fail-with-body -sS -A "Mozilla/5.0" \
            "https://github.com/users/Raahin-SUhail/contributions" \
            -o /tmp/contrib.html

      - name: Generate streak card
        run: python scripts/generate_activity_graph.py

      - name: Commit updated streak card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-streak.svg
          git diff --cached --quiet || git commit -m "Update GitHub streak card"
          git push
