<g transform="translate(710 92)"><circle r="50" fill="none" stroke="#21262D" stroke-width="7"/><circle r="50" fill="none" stroke="#C9D1D9" stroke-width="7" stroke-linecap="round" stroke-dasharray="21 314" transform="rotate(-90)"/><text y="7" text-anchor="middle" class="t" font-size="27" font-weight="700">3</text><text y="78" text-anchor="middle" class="m" font-size="13">LONGEST STREAK</text></g>
