<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Raahin Suhail technology stack</title>
  <desc id="desc">An animated premium dark panel showing verified languages, backend and frontend frameworks, database, and development tools.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020202"/>
      <stop offset="0.55" stop-color="#050505"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="scan" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="220" y2="0">
      <stop offset="0" stop-color="#E6EDF3" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E6EDF3" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#E6EDF3" stop-opacity="0"/>
    </linearGradient>
    <pattern id="microGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#30363D" stroke-width="0.5" opacity="0.13"/>
    </pattern>
    <clipPath id="panelClip">
      <rect x="12" y="12" width="1176" height="576" rx="24"/>
    </clipPath>
  </defs>
  <style>
    .heading{fill:#C9D1D9;font:600 18px 'Segoe UI',Arial,sans-serif;letter-spacing:2px}
    .label{fill:#F0F3F6;font:600 17px 'Segoe UI',Arial,sans-serif}
    .pill{fill:#080A0D;stroke:#30363D;stroke-width:1.5}
    .rule{stroke:#6E7681;stroke-width:1.5;stroke-linecap:round}
  </style>

  <rect x="12" y="12" width="1176" height="576" rx="24" fill="url(#panel)" stroke="#30363D" stroke-width="2"/>
  <g clip-path="url(#panelClip)">
    <rect x="12" y="12" width="1176" height="576" fill="url(#microGrid)"/>
    <rect x="-240" y="12" width="220" height="576" fill="url(#scan)">
      <animate attributeName="x" values="-240;1220" dur="12s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="55" y="68" class="heading">LANGUAGES</text>
  <path d="M55 78H226" class="rule" opacity="0.35">
    <animate attributeName="stroke-dasharray" values="12 159;171 0;12 159" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.28;0.72;0.28" dur="7s" repeatCount="indefinite"/>
  </path>
  <g transform="translate(55 88)">
    <rect class="pill" width="190" height="58" rx="14"><animate attributeName="stroke" values="#30363D;#3776AB;#30363D" dur="6s" repeatCount="indefinite"/></rect>
    <circle cx="28" cy="29" r="9" fill="#3776AB"><animate attributeName="r" values="8;10;8" dur="4.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.75;1;0.75" dur="4.8s" repeatCount="indefinite"/></circle>
    <text x="50" y="36" class="label">Python</text>
  </g>
  <g transform="translate(260 88)">
    <rect class="pill" width="190" height="58" rx="14"><animate attributeName="stroke" values="#30363D;#8F8617;#30363D" dur="6.7s" begin="0.5s" repeatCount="indefinite"/></rect>
    <circle cx="28" cy="29" r="9" fill="#F7DF1E"><animate attributeName="r" values="8;10;8" dur="5.2s" begin="0.4s" repeatCount="indefinite"/></circle>
    <text x="50" y="36" class="label">JavaScript</text>
  </g>
  <g transform="translate(465 88)">
    <rect class="pill" width="170" height="58" rx="14"><animate attributeName="stroke" values="#30363D;#8A3B24;#30363D" dur="6.3s" begin="1s" repeatCount="indefinite"/></rect>
    <circle cx="28" cy="29" r="9" fill="#E34F26"><animate attributeName="r" values="8;10;8" dur="5.6s" begin="0.8s" repeatCount="indefinite"/></circle>
    <text x="50" y="36" class="label">HTML5</text>
  </g>
  <g transform="translate(650 88)">
    <rect class="pill" width="160" height="58" rx="14"><animate attributeName="stroke" values="#30363D;#155986;#30363D" dur="6.9s" begin="1.4s" repeatCount="indefinite"/></rect>
    <circle cx="28" cy="29" r="9" fill="#1572B6"><animate attributeName="r" values="8;10;8" dur="5s" begin="1.2s" repeatCount="indefinite"/></circle>
    <text x="50" y="36" class="label">CSS3</text>
  </g>
  <g transform="translate(825 88)">
    <rect class="pill" width="140" height="58" rx="14"><animate attributeName="stroke" values="#30363D;#315D78;#30363D" dur="6.5s" begin="1.8s" repeatCount="indefinite"/></rect>
    <circle cx="28" cy="29" r="9" fill="#4479A1"><animate attributeName="r" values="8;10;8" dur="5.4s" begin="1.6s" repeatCount="indefinite"/></circle>
    <text x="50" y="36" class="label">SQL</text>
  </g>

  <text x="55" y="200" class="heading">BACKEND</text>
  <path d="M55 210H188" class="rule" opacity="0.35">
    <animate attributeName="stroke-dasharray" values="10 123;133 0;10 123" dur="7.6s" begin="0.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.28;0.72;0.28" dur="7.6s" begin="0.8s" repeatCount="indefinite"/>
  </path>
  <g transform="translate(55 220)">
    <rect class="pill" width="190" height="58" rx="14"><animate attributeName="stroke" values="#30363D;#00766B;#30363D" dur="6.4s" repeatCount="indefinite"/></rect>
    <circle cx="28" cy="29" r="9" fill="#009688"><animate attributeName="r" values="8;10;8" dur="5.1s" repeatCount="indefinite"/></circle>
    <text x="50" y="36" class="label">FastAPI</text>
  </g>
  <g transform="translate(260 220)">
    <rect class="pill" width="180" height="58" rx="14"><animate attributeName="stroke" values="#30363D;#176044;#30363D" dur="7s" begin="0.5s" repeatCount="indefinite"/></rect>
    <circle cx="28" cy="29" r="9" fill="#0C4B33"><animate attributeName="r" values="8;10;8" dur="5.7s" begin="0.5s" repeatCount="indefinite"/></circle>
    <text x="50" y="36" class="label">Django</text>
  </g>
  <g transform="translate(455 220)">
    <rect class="pill" width="170" height="58" rx="14"><animate attributeName="stroke" values="#30363D;#8B9299;#30363D" dur="6.6s" begin="1s" repeatCount="indefinite"/></rect>
    <circle cx="28" cy="29" r="9" fill="#E6EDF3"><animate attributeName="r" values="8;10;8" dur="5.3s" begin="1s" repeatCount="indefinite"/></circle>
    <text x="50" y="36" class="label">Flask</text>
  </g>
  <g transform="translate(640 220)">
    <rect class="pill" width="190" height="58" rx="14"><animate attributeName="stroke" values="#30363D;#6E7681;#30363D" dur="7.2s" begin="1.5s" repeatCount="indefinite"/></rect>
    <circle cx="28" cy="29" r="9" fill="#6E7681"><animate attributeName="r" values="8;10;8" dur="5.9s" begin="1.5s" repeatCount="indefinite"/></circle>
    <text x="50" y="36" class="label">REST APIs</text>
  </g>

  <text x="55" y="332" class="heading">FRONTEND</text>
  <path d="M55 342H200" class="rule" opacity="0.35">
    <animate attributeName="stroke-dasharray" values="10 135;145 0;10 135" dur="8s" begin="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.28;0.72;0.28" dur="8s" begin="1.2s" repeatCount="indefinite"/>
  </path>
  <g transform="translate(55 352)">
    <rect class="pill" width="170" height="58" rx="14"><animate attributeName="stroke" values="#30363D;#3A8695;#30363D" dur="6.8s" repeatCount="indefinite"/></rect>
    <circle cx="28" cy="29" r="9" fill="#61DAFB"><animate attributeName="r" values="8;10;8" dur="5.2s" repeatCount="indefinite"/></circle>
    <text x="50" y="36" class="label">React</text>
  </g>
  <g transform="translate(240 352)">
    <rect class="pill" width="210" height="58" rx="14"><animate attributeName="stroke" values="#30363D;#08758A;#30363D" dur="7.3s" begin="0.8s" repeatCount="indefinite"/></rect>
    <circle cx="28" cy="29" r="9" fill="#06B6D4"><animate attributeName="r" values="8;10;8" dur="5.7s" begin="0.8s" repeatCount="indefinite"/></circle>
    <text x="50" y="36" class="label">Tailwind CSS</text>
  </g>

  <text x="620" y="332" class="heading">DATABASE</text>
  <path d="M620 342H760" class="rule" opacity="0.35">
    <animate attributeName="stroke-dasharray" values="10 130;140 0;10 130" dur="8.4s" begin="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.28;0.72;0.28" dur="8.4s" begin="1.8s" repeatCount="indefinite"/>
  </path>
  <g transform="translate(620 352)">
    <rect class="pill" width="180" height="58" rx="14"><animate attributeName="stroke" values="#30363D;#315D78;#30363D" dur="7.1s" begin="1.4s" repeatCount="indefinite"/></rect>
    <circle cx="28" cy="29" r="9" fill="#4479A1"><animate attributeName="r" values="8;10;8" dur="5.5s" begin="1.4s" repeatCount="indefinite"/></circle>
    <text x="50" y="36" class="label">MySQL</text>
  </g>

  <text x="55" y="464" class="heading">DEVELOPMENT TOOLS</text>
  <path d="M55 474H300" class="rule" opacity="0.35">
    <animate attributeName="stroke-dasharray" values="12 233;245 0;12 233" dur="8.8s" begin="0.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.28;0.72;0.28" dur="8.8s" begin="0.4s" repeatCount="indefinite"/>
  </path>
  <g transform="translate(55 484)">
    <rect class="pill" width="150" height="58" rx="14"><animate attributeName="stroke" values="#30363D;#8E3825;#30363D" dur="6.5s" repeatCount="indefinite"/></rect>
    <circle cx="28" cy="29" r="9" fill="#F05032"><animate attributeName="r" values="8;10;8" dur="5s" repeatCount="indefinite"/></circle>
    <text x="50" y="36" class="label">Git</text>
  </g>
  <g transform="translate(220 484)">
    <rect class="pill" width="180" height="58" rx="14"><animate attributeName="stroke" values="#30363D;#8B9299;#30363D" dur="7s" begin="0.8s" repeatCount="indefinite"/></rect>
    <circle cx="28" cy="29" r="9" fill="#F0F3F6"><animate attributeName="r" values="8;10;8" dur="5.6s" begin="0.8s" repeatCount="indefinite"/></circle>
    <text x="50" y="36" class="label">GitHub</text>
  </g>

  <path d="M55 566H1145" stroke="#30363D" stroke-width="1"/>
  <path d="M55 566H235" stroke="#C9D1D9" stroke-width="1.5" opacity="0.8">
    <animateTransform attributeName="transform" type="translate" values="0 0;910 0;0 0" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.25;0.85;0.25" dur="10s" repeatCount="indefinite"/>
  </path>
</svg>
