<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Raahin Suhail technology stack</title>
  <desc id="desc">Verified languages, backend and frontend frameworks, database, and development tools.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#15191E"/>
    </linearGradient>
  </defs>
  <rect x="12" y="12" width="1176" height="576" rx="24" fill="url(#panel)" stroke="#30363D" stroke-width="2"/>
  <style>
    .heading{fill:#C9D1D9;font:600 18px 'Segoe UI',Arial,sans-serif;letter-spacing:2px}
    .label{fill:#F0F3F6;font:600 17px 'Segoe UI',Arial,sans-serif}
    .pill{fill:#050505;stroke:#30363D;stroke-width:1.5}
  </style>

  <text x="55" y="68" class="heading">LANGUAGES</text>
  <g transform="translate(55 88)">
    <rect class="pill" width="190" height="58" rx="14"/><circle cx="28" cy="29" r="9" fill="#3776AB"/><text x="50" y="36" class="label">Python</text>
  </g>
  <g transform="translate(260 88)">
    <rect class="pill" width="190" height="58" rx="14"/><circle cx="28" cy="29" r="9" fill="#F7DF1E"/><text x="50" y="36" class="label">JavaScript</text>
  </g>
  <g transform="translate(465 88)">
    <rect class="pill" width="170" height="58" rx="14"/><circle cx="28" cy="29" r="9" fill="#E34F26"/><text x="50" y="36" class="label">HTML5</text>
  </g>
  <g transform="translate(650 88)">
    <rect class="pill" width="160" height="58" rx="14"/><circle cx="28" cy="29" r="9" fill="#1572B6"/><text x="50" y="36" class="label">CSS3</text>
  </g>
  <g transform="translate(825 88)">
    <rect class="pill" width="140" height="58" rx="14"/><circle cx="28" cy="29" r="9" fill="#4479A1"/><text x="50" y="36" class="label">SQL</text>
  </g>

