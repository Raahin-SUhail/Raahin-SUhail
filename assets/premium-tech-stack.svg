  <g transform="translate(55 220)">
    <rect class="pill" width="190" height="58" rx="14"/><circle cx="28" cy="29" r="9" fill="#009688"/><text x="50" y="36" class="label">FastAPI</text>
  </g>
  <g transform="translate(260 220)">
    <rect class="pill" width="180" height="58" rx="14"/><circle cx="28" cy="29" r="9" fill="#0C4B33"/><text x="50" y="36" class="label">Django</text>
  </g>
  <g transform="translate(455 220)">
    <rect class="pill" width="170" height="58" rx="14"/><circle cx="28" cy="29" r="9" fill="#E6EDF3"/><text x="50" y="36" class="label">Flask</text>
  </g>
