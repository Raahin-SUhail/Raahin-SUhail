<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 130" role="img" aria-labelledby="title desc">
  <title id="title">Floating development symbols</title>
  <desc id="desc">Subtle animated code, API, Git and database symbols on a rich black panel.</desc>
  <rect x="12" y="12" width="1176" height="106" rx="20" fill="#050505" stroke="#30363D" stroke-width="1.5"/>
  <g fill="#9DA7B3" font-family="Consolas,monospace" font-size="18">
    <text x="80" y="72" opacity=".24">&lt;/&gt;<animateTransform attributeName="transform" type="translate" values="0 0;0 -9;0 0" dur="4s" repeatCount="indefinite"/></text>
    <text x="225" y="60" opacity=".18">{ }<animateTransform attributeName="transform" type="translate" values="0 0;0 8;0 0" dur="5s" repeatCount="indefinite"/></text>
    <text x="360" y="78" opacity=".22">import<animateTransform attributeName="transform" type="translate" values="0 0;8 0;0 0" dur="5.5s" repeatCount="indefinite"/></text>
    <text x="520" y="58" opacity=".18">git<animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="4.6s" repeatCount="indefinite"/></text>
    <text x="650" y="78" opacity=".23">API<animateTransform attributeName="transform" type="translate" values="0 0;-8 0;0 0" dur="5s" repeatCount="indefinite"/></text>
    <text x="785" y="58" opacity=".18">SQL<animateTransform attributeName="transform" type="translate" values="0 0;0 8;0 0" dur="4.4s" repeatCount="indefinite"/></text>
    <text x="925" y="77" opacity=".22">fn()<animateTransform attributeName="transform" type="translate" values="0 0;7 0;0 0" dur="5.2s" repeatCount="indefinite"/></text>
    <text x="1060" y="60" opacity=".18">/ship<animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="5.8s" repeatCount="indefinite"/></text>
  </g>
</svg>