<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Raahin Suhail — Full Stack Developer</title>
  <desc id="desc">A premium black animated developer header with subtle silver sweeps, scanning lines, code marks, and particles.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#010101"/>
      <stop offset="0.5" stop-color="#050505"/>
      <stop offset="1" stop-color="#090B0E"/>
    </linearGradient>
    <radialGradient id="surface" cx="50%" cy="42%" r="68%">
      <stop offset="0" stop-color="#15191E" stop-opacity="0.68"/>
      <stop offset="0.52" stop-color="#0D1117" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameSweep" gradientUnits="userSpaceOnUse" x1="-420" y1="0" x2="20" y2="0">
      <stop offset="0" stop-color="#6E7681"/>
      <stop offset="0.32" stop-color="#C9D1D9"/>
      <stop offset="0.49" stop-color="#FFFFFF"/>
      <stop offset="0.61" stop-color="#FFFFFF"/>
      <stop offset="0.78" stop-color="#C9D1D9"/>
      <stop offset="1" stop-color="#6E7681"/>
      <animate attributeName="x1" values="-420;1180" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="20;1620" dur="4.2s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="scanner" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="180" y2="0">
      <stop offset="0" stop-color="#E6EDF3" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="1" stop-color="#E6EDF3" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#30363D" stroke-width="0.6" opacity="0.2"/>
    </pattern>
    <clipPath id="panelClip">
      <rect x="12" y="12" width="1176" height="316" rx="28"/>
    </clipPath>
  </defs>

  <rect x="12" y="12" width="1176" height="316" rx="28" fill="url(#background)" stroke="#30363D" stroke-width="2"/>
  <g clip-path="url(#panelClip)">
    <rect x="12" y="12" width="1176" height="316" fill="url(#surface)"/>
    <rect x="12" y="12" width="1176" height="316" fill="url(#grid)"/>

    <g fill="#C9D1D9">
      <circle cx="105" cy="88" r="3.2" opacity="0.26">
        <animate attributeName="opacity" values="0.18;0.9;0.18" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1090" cy="86" r="3" opacity="0.24">
        <animate attributeName="opacity" values="0.18;0.86;0.18" dur="3.8s" begin="1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="160" cy="260" r="2.8" opacity="0.2">
        <animate attributeName="opacity" values="0.14;0.8;0.14" dur="4.2s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1040" cy="255" r="3" opacity="0.2">
        <animate attributeName="opacity" values="0.14;0.82;0.14" dur="3.6s" begin="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g fill="#C9D1D9" font-family="Consolas,'Courier New',monospace" font-size="17" letter-spacing="1" opacity="0.42">
      <text x="76" y="130">&lt;/&gt;
        <animateTransform attributeName="transform" type="translate" values="0 7;0 -7;0 7" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.28;0.78;0.28" dur="4s" repeatCount="indefinite"/>
      </text>
      <text x="1080" y="134">{ }
        <animateTransform attributeName="transform" type="translate" values="0 -7;0 7;0 -7" dur="4.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.26;0.74;0.26" dur="4.6s" repeatCount="indefinite"/>
      </text>
      <text x="84" y="250">API
        <animateTransform attributeName="transform" type="translate" values="-7 0;7 0;-7 0" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.25;0.7;0.25" dur="5s" repeatCount="indefinite"/>
      </text>
      <text x="1072" y="250">SQL
        <animateTransform attributeName="transform" type="translate" values="7 0;-7 0;7 0" dur="4.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.25;0.7;0.25" dur="4.8s" repeatCount="indefinite"/>
      </text>
    </g>

    <path d="M55 66H1145" stroke="#30363D" stroke-width="1" stroke-dasharray="4 13" opacity="0.58">
      <animate attributeName="stroke-dashoffset" values="0;-68" dur="8s" repeatCount="indefinite"/>
    </path>
    <rect x="-200" y="64" width="180" height="3" rx="1.5" fill="url(#scanner)">
      <animate attributeName="x" values="-200;1220" dur="4s" repeatCount="indefinite"/>
    </rect>

    <g fill="none" stroke="#C9D1D9" stroke-width="2" opacity="0.62">
      <path d="M44 116V44H116" stroke-dasharray="18 126">
        <animate attributeName="stroke-dashoffset" values="144;0;-144" dur="5s" repeatCount="indefinite"/>
      </path>
      <path d="M1084 296H1156V224" stroke-dasharray="18 126">
        <animate attributeName="stroke-dashoffset" values="-144;0;144" dur="5s" repeatCount="indefinite"/>
      </path>
    </g>

    <text x="600" y="177" text-anchor="middle" fill="url(#nameSweep)" font-family="'Segoe UI',Arial,sans-serif" font-size="70" font-weight="700" letter-spacing="12">RAAHIN SUHAIL</text>
    <text x="600" y="230" text-anchor="middle" fill="#9DA7B3" font-family="'Segoe UI',Arial,sans-serif" font-size="21" font-weight="500" letter-spacing="3">FULL STACK DEVELOPER  •  PYTHON ENGINEER  •  BACKEND DEVELOPER</text>

    <g transform="translate(445 262)">
      <path d="M0 0H310" stroke="#30363D" stroke-width="1"/>
      <rect x="0" y="-2" width="74" height="4" rx="2" fill="#E6EDF3" opacity="0.95">
        <animate attributeName="x" values="0;236;0" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.55;1;0.55" dur="5s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <rect x="20" y="20" width="1160" height="300" rx="23" fill="none" stroke="#C9D1D9" stroke-width="2" stroke-dasharray="230 930" opacity="0.74">
    <animate attributeName="stroke-dashoffset" values="0;-2320" dur="10s" repeatCount="indefinite"/>
  </rect>
</svg>
