<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Raahin Suhail</title>
  <desc id="desc">Premium animated header for Raahin Suhail, Backend Developer, Python Engineer, and Web Developer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.55" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#15191E"/>
    </linearGradient>
    <linearGradient id="silver" x1="-1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#6E7681"/>
      <stop offset="0.45" stop-color="#F0F3F6"/>
      <stop offset="0.58" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#9DA7B3"/>
      <animate attributeName="x1" values="-1;1" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#30363D" stroke-width="0.6" opacity="0.34"/>
    </pattern>
    <filter id="soft">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <rect x="12" y="12" width="1176" height="316" rx="28" fill="url(#bg)" stroke="#30363D" stroke-width="2"/>
  <rect x="13" y="13" width="1174" height="314" rx="27" fill="url(#grid)"/>
  <path d="M52 70H1148" stroke="#C9D1D9" stroke-width="1" stroke-dasharray="12 18" opacity="0.45">
    <animate attributeName="stroke-dashoffset" values="0;-60" dur="5s" repeatCount="indefinite"/>
  </path>
  <circle cx="92" cy="265" r="4" fill="#E6EDF3">
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1100" cy="96" r="3" fill="#9DA7B3">
    <animate attributeName="opacity" values="0.8;0.15;0.8" dur="4s" repeatCount="indefinite"/>
  </circle>
  <rect x="180" y="118" width="840" height="92" rx="46" fill="#E6EDF3" opacity="0.04" filter="url(#soft)"/>
  <text x="600" y="184" text-anchor="middle" fill="url(#silver)" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="12">RAAHIN SUHAIL</text>
  <text x="600" y="239" text-anchor="middle" fill="#9DA7B3" font-family="Segoe UI, Arial, sans-serif" font-size="22" letter-spacing="3">BACKEND DEVELOPER  •  PYTHON ENGINEER  •  WEB DEVELOPER</text>
  <rect x="48" y="292" width="1104" height="2" rx="1" fill="#30363D"/>
  <rect x="48" y="292" width="180" height="2" rx="1" fill="#E6EDF3" opacity="0.9">
    <animate attributeName="x" values="48;972;48" dur="7s" repeatCount="indefinite"/>
  </rect>
</svg>