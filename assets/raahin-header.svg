<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Raahin Suhail — Full Stack Developer</title>
  <desc id="desc">A premium black animated developer header with subtle silver sweeps, scanning lines, code marks, and particles.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#010101"/>
      <stop offset="0.5" stop-color="#050505"/>
      <stop offset="1" stop-color="#090B0E"/>
    </linearGradient>
    <radialGradient id="surface" cx="50%" cy="42%" r="68%">
      <stop offset="0" stop-color="#15191E" stop-opacity="0.68"/>
      <stop offset="0.52" stop-color="#0D1117" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameSweep" gradientUnits="userSpaceOnUse" x1="-420" y1="0" x2="20" y2="0">
      <stop offset="0" stop-color="#9DA7B3"/>
      <stop offset="0.4" stop-color="#E6EDF3"/>
      <stop offset="0.53" stop-color="#FFFFFF"/>
      <stop offset="0.68" stop-color="#C9D1D9"/>
      <stop offset="1" stop-color="#9DA7B3"/>
      <animate attributeName="x1" values="-420;1180" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="20;1620" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="scanner" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="180" y2="0">
      <stop offset="0" stop-color="#E6EDF3" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E6EDF3" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#E6EDF3" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#30363D" stroke-width="0.6" opacity="0.2"/>
    </pattern>
    <clipPath id="panelClip">
      <rect x="12" y="12" width="1176" height="316" rx="28"/>
    </clipPath>
  </defs>

  <rect x="12" y="12" width="1176" height="316" rx="28" fill="url(#background)" stroke="#30363D" stroke-width="2"/>
  <g clip-path="url(#panelClip)">
    <rect x="12" y="12" width="1176" height="316" fill="url(#surface)"/>
    <rect x="12" y="12" width="1176" height="316" fill="url(#grid)"/>

    <g fill="#C9D1D9">
      <circle cx="105" cy="88" r="2.2" opacity="0.16">
        <animate attributeName="opacity" values="0.12;0.6;0.12" dur="5.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1090" cy="86" r="1.8" opacity="0.18">
        <animate attributeName="opacity" values="0.18;0.7;0.18" dur="6.2s" begin="1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="160" cy="260" r="1.7" opacity="0.14">
        <animate attributeName="opacity" values="0.12;0.55;0.12" dur="6.8s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1040" cy="255" r="2" opacity="0.14">
        <animate attributeName="opacity" values="0.14;0.62;0.14" dur="5.8s" begin="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g fill="#9DA7B3" font-family="Consolas,'Courier New',monospace" font-size="15" letter-spacing="1" opacity="0.2">
      <text x="76" y="130">&lt;/&gt;
        <animateTransform attributeName="transform" type="translate" values="0 3;0 -3;0 3" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.16;0.32;0.16" dur="6s" repeatCount="indefinite"/>
      </text>
      <text x="1080" y="134">{ }
        <animateTransform attributeName="transform" type="translate" values="0 -3;0 3;0 -3" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.14;0.3;0.14" dur="7s" repeatCount="indefinite"/>
      </text>
      <text x="84" y="250">API
        <animateTransform attributeName="transform" type="translate" values="-3 0;3 0;-3 0" dur="8s" repeatCount="indefinite"/>
      </text>
      <text x="1072" y="250">SQL
        <animateTransform attributeName="transform" type="translate" values="3 0;-3 0;3 0" dur="7.4s" repeatCount="indefinite"/>
      </text>
    </g>

    <path d="M55 66H1145" stroke="#30363D" stroke-width="1" stroke-dasharray="4 13" opacity="0.58">
      <animate attributeName="stroke-dashoffset" values="0;-68" dur="8s" repeatCount="indefinite"/>
    </path>
    <rect x="-200" y="65" width="180" height="1" fill="url(#scanner)">
      <animate attributeName="x" values="-200;1220" dur="6.5s" repeatCount="indefinite"/>
    </rect>

    <text x="600" y="177" text-anchor="middle" fill="url(#nameSweep)" font-family="'Segoe UI',Arial,sans-serif" font-size="70" font-weight="700" letter-spacing="12">RAAHIN SUHAIL</text>
    <text x="600" y="230" text-anchor="middle" fill="#9DA7B3" font-family="'Segoe UI',Arial,sans-serif" font-size="21" font-weight="500" letter-spacing="3">FULL STACK DEVELOPER  •  PYTHON ENGINEER  •  BACKEND DEVELOPER</text>

    <g transform="translate(445 262)">
      <path d="M0 0H310" stroke="#30363D" stroke-width="1"/>
      <rect x="0" y="-1" width="54" height="2" rx="1" fill="#C9D1D9" opacity="0.9">
        <animate attributeName="x" values="0;256;0" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.45;0.95;0.45" dur="8s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <rect x="20" y="20" width="1160" height="300" rx="23" fill="none" stroke="#6E7681" stroke-width="1" stroke-dasharray="150 1010" opacity="0.55">
    <animate attributeName="stroke-dashoffset" values="0;-2320" dur="16s" repeatCount="indefinite"/>
  </rect>
</svg>
